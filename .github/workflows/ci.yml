name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false # zero-dependency module, nothing to cache
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build arm64 (the real target)
        run: CGO_ENABLED=0 GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o cellar-arm64 .
      - name: build amd64 (dev boxes)
        run: CGO_ENABLED=0 GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o cellar-amd64 .
      - uses: actions/upload-artifact@v4
        with:
          name: cellar-binaries
          path: engine/cellar-*

  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck stacks
        run: shellcheck catalog/*/apply.sh

  # proot is slow to build (termux-packages Docker) and changes only when
  # its pinned tag does, so it's cached on the recipe's hash.
  proot:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.k.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - id: k
        run: echo "key=proot-${{ hashFiles('proot/build.sh') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: proot/out
          key: ${{ steps.k.outputs.key }}
      - name: build static proot + unbundled loader
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/termux/termux-packages
          mkdir -p termux-packages/packages/proot-apk
          cp proot/build.sh termux-packages/packages/proot-apk/build.sh
          cd termux-packages
          ./scripts/run-docker.sh ./build-package.sh -a aarch64 proot-apk
          # the build container can't write to the repo, so take the
          # binaries out of the .deb it produced
          deb=$(find output -name 'proot-apk_*_aarch64.deb' | head -1)
          test -n "$deb" || { echo "no .deb produced"; find output -type f; exit 1; }
          dpkg-deb -x "$deb" unpacked
          mkdir -p ../proot/out
          cp unpacked/data/data/com.termux/files/usr/bin/proot ../proot/out/libproot.so
          cp unpacked/data/data/com.termux/files/usr/libexec/proot/loader ../proot/out/libproot_loader.so
      - name: verify static + 16KB page alignment
        run: |
          cd proot/out
          for f in libproot.so libproot_loader.so; do
            echo "== $f"
            readelf -l "$f" | grep -q INTERP && { echo "$f is dynamically linked"; exit 1; }
            align=$(readelf -l "$f" | awk '/LOAD/ {print $NF; exit}')
            echo "align=$align"
            [ "$((align))" -ge "$((0x4000))" ] || { echo "$f is not 16KB-aligned"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: proot-binaries
          path: proot/out/*

  app:
    runs-on: ubuntu-latest
    needs: [engine, proot]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: cellar-binaries
          path: /tmp/engine
      - uses: actions/download-artifact@v4
        with:
          name: proot-binaries
          path: /tmp/proot
      - name: bundle engine + proot as jniLibs
        run: |
          d=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$d"
          cp /tmp/engine/cellar-arm64 "$d/libcellar.so"
          cp /tmp/proot/libproot.so /tmp/proot/libproot_loader.so "$d/"
          chmod +x "$d"/*.so
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: build debug APK
        run: gradle -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cellar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

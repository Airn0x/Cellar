name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: build engine
        run: |
          cd engine
          CGO_ENABLED=0 GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o cellar-arm64 .

      # proot changes only when its pinned recipe does
      - id: prootcache
        uses: actions/cache@v4
        with:
          path: proot/out
          key: proot-${{ hashFiles('proot/build.sh') }}
      - name: build static proot + unbundled loader
        if: steps.prootcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/termux/termux-packages
          mkdir -p termux-packages/packages/proot-apk
          cp proot/build.sh termux-packages/packages/proot-apk/build.sh
          cd termux-packages
          ./scripts/run-docker.sh ./build-package.sh -a aarch64 proot-apk
          deb=$(find output -name 'proot-apk_*_aarch64.deb' | head -1)
          dpkg-deb -x "$deb" unpacked
          mkdir -p ../proot/out
          cp unpacked/data/data/com.termux/files/usr/bin/proot ../proot/out/libproot.so
          cp unpacked/data/data/com.termux/files/usr/libexec/proot/loader ../proot/out/libproot_loader.so

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: assemble APK at the tag's version
        run: |
          v="${GITHUB_REF_NAME#v}"
          d=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$d"
          cp engine/cellar-arm64 "$d/libcellar.so"
          cp proot/out/libproot.so proot/out/libproot_loader.so "$d/"
          chmod +x "$d"/*.so
          gradle -p android :app:assembleDebug -PcellarVersion="$v"
          cp android/app/build/outputs/apk/debug/app-debug.apk "cellar-$GITHUB_REF_NAME.apk"

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "cellar-$GITHUB_REF_NAME.apk" \
            --title "Cellar $GITHUB_REF_NAME" \
            --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" "cellar-$GITHUB_REF_NAME.apk" --clobber
